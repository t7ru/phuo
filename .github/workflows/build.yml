name: Build and Release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { goos: linux, goarch: amd64, bin: phuo-linux-amd64 }
                    - {
                          goos: windows,
                          goarch: amd64,
                          bin: phuo-windows-amd64.exe,
                      }
                    - { goos: darwin, goarch: amd64, bin: phuo-macos-amd64 }
                    - { goos: darwin, goarch: arm64, bin: phuo-macos-arm64 }
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
            - shell: bash
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: "0"
              run: |
                  go build -trimpath \
                    -ldflags="-s -w -X github.com/t7ru/phuo/internal/version.stamp=${{ github.ref_name }}" \
                    -o "bin/${{ matrix.bin }}" .
            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.bin }}
                  path: bin/*

    create-release:
        runs-on: ubuntu-slim
        needs: [build]
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Restore executables permissions
              run: chmod +x artifacts/phuo*

            - name: Prepare release archives
              run: |
                  for dest in linux-amd64 windows-amd64 macos-amd64 macos-arm64; do
                    mkdir -p "release-$dest"
                    cp README.md LICENSE "release-$dest/"
                  done
                  cp artifacts/phuo-linux-amd64 release-linux-amd64/phuo
                  cp artifacts/phuo-windows-amd64.exe release-windows-amd64/phuo.exe
                  cp artifacts/phuo-macos-amd64 release-macos-amd64/phuo
                  cp artifacts/phuo-macos-arm64 release-macos-arm64/phuo

            - name: Package archives
              run: |
                  cd release-linux-amd64
                  tar -czf "../phuo-$GITHUB_REF_NAME-linux-amd64.tar.gz" *
                  cd ..

                  cd release-windows-amd64
                  zip -r "../phuo-$GITHUB_REF_NAME-windows-amd64.zip" *
                  cd ..

                  cd release-macos-amd64
                  zip -r "../phuo-$GITHUB_REF_NAME-macos-amd64.zip" *
                  cd ..

                  cd release-macos-arm64
                  zip -r "../phuo-$GITHUB_REF_NAME-macos-arm64.zip" *
                  cd ..

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref_name }}
                  files: |
                      phuo-${{ github.ref_name }}-linux-amd64.tar.gz
                      phuo-${{ github.ref_name }}-windows-amd64.zip
                      phuo-${{ github.ref_name }}-macos-amd64.zip
                      phuo-${{ github.ref_name }}-macos-arm64.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Get previous tag
              id: prev_tag
              run: |
                  git fetch --tags --force
                  PREV=$(git tag --list 'v*' --sort=-version:refname \
                    | grep -v "^${{ github.ref_name }}$" \
                    | head -n 1)
                  echo "prev=${PREV}" >> $GITHUB_OUTPUT

            - name: Build changelog
              id: changelog
              uses: mikepenz/release-changelog-builder-action@v6
              with:
                  fromTag: ${{ steps.prev_tag.outputs.prev }}
                  toTag: ${{ github.ref_name }}
                  mode: "COMMIT"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Update release
              run: gh release edit "${{ github.ref_name }}" --notes "${{ steps.changelog.outputs.changelog }}"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
